<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Caleb's HN Reader</title>
  </head>
  <body>
    <select id="category" onchange="displayStories()"></select>
    <div id="content"></div>

    <script>
        let stories = [];
        let categories = {
            "test": [],
            "another": []
        }

        loadValues = async function() {
            res = await fetch('http://localhost:8080/')
            stories = await res.json()
            displayStories()
        }

        handleCategorizeStory = function(sel) {
            id = sel.id
            category = sel.value
            story = stories.find(story => story.id == id) // == not === because story.id is an int but id is a string
            domain = story['domain']

            Object.keys(categories).forEach(category => {
                let i = categories[category].indexOf(domain)
                if (i > -1) {
                    categories[category].splice(i, 1) // remove 1 element at this index
                }
            })

            categories[category].push(domain)

            displayStories()
        }

        appendSelectOptions = function(element) {
            let uncategorized = document.createElement("option")
            uncategorized.value = ''
            uncategorized.text = 'Uncategorized'
            element.appendChild(uncategorized)

            Object.keys(categories).forEach(category => {
                let opt = document.createElement("option")
                opt.value = category
                opt.text = category
                element.appendChild(opt)
            });
        }

        appendStory = function(story) {
            let d = document.createElement('div')
            d.style.border = "1px solid #000";
            document.getElementById("content").appendChild(d)

            let a = document.createElement('a')
            a.innerHTML = story['title']
            a.href = story['link']
            d.appendChild(a)

            let p = document.createElement('p')
            p.innerHTML = story['domain']
            d.appendChild(p)

            let sel = document.createElement('select')
            sel.id = story['id']
            d.appendChild(sel)
            appendSelectOptions(sel)
            // TODO set correct value
            sel.addEventListener(
                'change',
                function() { handleCategorizeStory(sel); },
                false
            );
        }

        displayStories = function() {
            document.getElementById("content").innerHTML = ''
            currentCategory = document.getElementById("category").value
            // if currentCategory is blank, show stories where domain is not in any other category... otherwise filter them by that category
            if (currentCategory === '') {
                stories.forEach(story => {
                    appendStory(story)
                });
            } else {
                stories.filter(story => {
                    return categories[currentCategory]?.includes(story["domain"])
                }).forEach(story => {
                    appendStory(story)
                });
            }
        }

        loadValues()
        appendSelectOptions(document.getElementById("category"))
    </script>
  </body>
</html>
