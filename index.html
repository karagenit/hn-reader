<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Caleb's HN Reader</title>
  </head>
  <body>
    <select id="category" onchange="displayStories()"></select>
    <div id="content"></div>

    <script>
        let stories = [];
        let categories = { // TODO fill select with these options
            "test": [],
            "another": []
        }

        loadValues = async function() {
            res = await fetch('http://localhost:8080/')
            stories = await res.json()
            displayStories()
        }

        appendSelectOptions = function(element) {
            let uncategorized = document.createElement("option")
            uncategorized.value = ''
            uncategorized.text = 'Uncategorized'
            element.appendChild(uncategorized)

            Object.keys(categories).forEach(category => {
                let opt = document.createElement("option")
                opt.value = category
                opt.text = category
                element.appendChild(opt)
            });
        }

        appendStory = function(story) {
            let p = document.createElement('p')
            p.innerHTML = story['title']
            document.getElementById("content").appendChild(p)

            let sel = document.createElement('select')
            sel.id = story['id']
            document.getElementById("content").appendChild(sel)
            appendSelectOptions(sel)
        }

        displayStories = function() {
            document.getElementById("content").innerHTML = ''
            currentCategory = document.getElementById("category").value
            // if currentCategory is blank, show stories where domain is not in any other category... otherwise filter them by that category
            if (currentCategory === '') {
                stories.forEach(story => {
                    appendStory(story)
                });
            } else {
                stories.filter(story => {
                    return categories[currentCategory]?.includes(story["domain"])
                }).forEach(story => {
                    appendStory(story)
                });
            }
        }

        loadValues()
        appendSelectOptions(document.getElementById("category"))
    </script>
  </body>
</html>
