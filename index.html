<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Caleb's HN Reader</title>
    <style>
        #content div {
            border: 1px solid #aaa;
            border-radius: 4px;
            margin-top: 0.5rem;
        }

        #content a {
            color: #000;
            text-decoration: none;
        }

        #content a:visited {
            color: #666;
        }

        #content {
            border: none;
            margin-top: 0;
            padding: 0;
        }

        p {
            margin: 1rem;
        }

        .links {
            float: right;
        }

        .close-button {
            float: right;
            padding: 0.75rem;
            font-size: 1.25rem;
            color: #ba0000;
        }
    </style>
  </head>
  <body>
    <div>
        <span>Posts in </span>
        <select id="category" onchange="displayStories()"></select>
        <span class="links">
            <a href="https://caleb.software/posts/hn-reader.html">About</a>
            &nbsp;&nbsp;
            <a href="/settings">Settings</a>
        </span>
    </div>
    
    <div id="content">
        <p>Loading...</p>
    </div>

    <script>
        let stories = [];
        let categories = {
            "Technology": [],
            "Interesting": [],
            "Business": [],
            "Science": [],
            "Projects & Companies": [],
            "Garbage": []
        }

        storedCategories = localStorage.getItem("categories");

        if (storedCategories) {
            categories = JSON.parse(storedCategories)
        }

        // Map of Date -> Array of story IDs
        let hiddenStories = {};

        storedHiddenStories = localStorage.getItem("hiddenStories");

        if (storedHiddenStories) {
            hiddenStories = JSON.parse(storedHiddenStories);
        }

        getHiddenStories = function() {
            return Object.keys(hiddenStories).map(date => {
                return hiddenStories[date];
            }).flat();
        }

        addHiddenStory = function(id) {
            today = getTodayDayNumber()
            if (!hiddenStories[today]) {
                hiddenStories[today] = []
            }
            hiddenStories[today].push(parseInt(id));
        }

        saveHiddenStories = function() {
            // Only save the last 7 days worth of hidden stories so we don't blow up our local storage over time
            today = getTodayDayNumber()
            Object.keys(hiddenStories).forEach(date => {
                if (date < today - 7) {
                    delete hiddenStories[date];
                }
            });
            localStorage.setItem('hiddenStories', JSON.stringify(hiddenStories))
        }

        getTodayDayNumber = function() {
            return Math.floor(Date.now() / (1000 * 60 * 60 * 24));
        }

        loadValues = async function() {
            res = await fetch('/stories')
            stories = await res.json()
            displayStories()
        }

        handleCategorizeStory = function(sel) {
            id = sel.id
            category = sel.value
            story = stories.find(story => story.id == id) // == not === because story.id is an int but id is a string
            domain = story['domain']

            Object.keys(categories).forEach(category => {
                let i = categories[category].indexOf(domain)
                if (i > -1) {
                    categories[category].splice(i, 1) // remove 1 element at this index
                }
            })

            // Add the domain to the newly selected category, unless it's the Uncategorized category (which doesn't exist in our map)
            if (categories[category]) {
                categories[category].push(domain)
            }

            displayStories()

            localStorage.setItem('categories', JSON.stringify(categories))
        }

        handleHideStory = function(button) {
            id = button.id
            addHiddenStory(id)
            displayStories()
            saveHiddenStories()
        }

        appendSelectOptions = function(element) {
            let uncategorized = document.createElement("option")
            uncategorized.value = ''
            uncategorized.text = 'Uncategorized'
            element.appendChild(uncategorized)

            Object.keys(categories).forEach(category => {
                let opt = document.createElement("option")
                opt.value = category
                opt.text = category
                element.appendChild(opt)
            });
        }

        getDomainCategory = function(domain) {
            return Object.keys(categories).find(category => categories[category].includes(domain)) ?? ''
        }

        handleClickStory = function(id, comments_url) {
            history.replaceState(null, '', '/#id-' + id)
            // TODO not allowed, need to create my own /redirect?comments=url endpoint to handle this ugh
            //history.pushState(null, "", comments_url);
            return true;
        }

        appendStory = function(story) {
            let d = document.createElement('div')
            d.id = 'id-' + story['id']
            document.getElementById("content").appendChild(d)

            let close = document.createElement('span')
            close.innerHTML = '&#9746;'
            close.classList = 'close-button'
            close.id = story['id'] // TODO gonna have duplicate IDs here...
            close.addEventListener(
                'click',
                function() { handleHideStory(close); },
                false
            );
            d.append(close)

            let p1 = document.createElement('p')
            d.appendChild(p1);

            let a = document.createElement('a')
            a.innerHTML = '[' + story['score'] + '] ' + story['title']
            a.href = story['link']
            a.addEventListener(
                'click',
                function() { handleClickStory(story['id'], story['comments']) },
                false
            )
            p1.appendChild(a)

            let s1 = document.createElement('span')
            s1.innerHTML = ' '
            p1.appendChild(s1);

            let comments = document.createElement('a')
            comments.innerHTML = '(' + story['descendants'] + ' comments)'
            comments.href = story['comments']
            p1.appendChild(comments)

            let p2 = document.createElement('p')
            d.appendChild(p2)

            let s2 = document.createElement('span')
            s2.innerHTML = story['domain'] + '&nbsp;'
            p2.appendChild(s2)

            let sel = document.createElement('select')
            sel.id = story['id']
            p2.appendChild(sel)
            appendSelectOptions(sel)
            sel.addEventListener(
                'change',
                function() { handleCategorizeStory(sel); },
                false
            );
            sel.value = getDomainCategory(story['domain'])
        }

        displayStories = function() {
            hiddenIds = getHiddenStories()
            document.getElementById("content").innerHTML = ''
            currentCategory = document.getElementById("category").value
            stories.filter(story => {
                return currentCategory === getDomainCategory(story['domain'])
            }).filter(story => {
                return !hiddenIds.includes(story['id'])
            }).slice(0, 50).forEach(story => appendStory(story));

            // TODO instead of jumping to it should we just display this story at the top? what if it's fallen out of the top 50?
            if (window.location.hash) {
                document.querySelector(window.location.hash).scrollIntoView()
            }
        }

        loadValues()
        appendSelectOptions(document.getElementById("category"))
    </script>
  </body>
</html>
