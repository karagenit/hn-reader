<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Caleb's HN Reader</title>
    <style>
        details {
            border: 1px solid #aaa;
            border-radius: 4px;
            margin-top: 0.5rem;
        }

        a {
            color: #000;
            text-decoration: none;
        }

        a:visited {
            color: #666;
        }

        #content {
            border: none;
            margin-top: 0;
            padding: 0;
        }

        summary {
            margin-bottom: 1rem;
            margin: 1rem;
        }

        p {
            margin: 1rem;
            margin-top: 0;
        }
    </style>
  </head>
  <body>
    <select id="category" onchange="displayStories()"></select>
    <div id="content"></div>

    <script>
        let stories = [];
        let categories = {
            "Blog (Indie)": [],
            "Blog (Company)": [],
            "Project": [],
            "Company": [],
            "Article (News)": [],
            "Article (Misc)": [],
            "Academic/Science": [],
        }

        storedCategories = localStorage.getItem("categories");

        if (storedCategories) {
            categories = JSON.parse(storedCategories)
        }

        loadValues = async function() {
            res = await fetch('/stories')
            stories = await res.json()
            displayStories()
        }

        handleCategorizeStory = function(sel) {
            id = sel.id
            category = sel.value
            story = stories.find(story => story.id == id) // == not === because story.id is an int but id is a string
            domain = story['domain']

            Object.keys(categories).forEach(category => {
                let i = categories[category].indexOf(domain)
                if (i > -1) {
                    categories[category].splice(i, 1) // remove 1 element at this index
                }
            })

            // Add the domain to the newly selected category, unless it's the Uncategorized category (which doesn't exist in our map)
            if (categories[category]) {
                categories[category].push(domain)
            }

            displayStories()

            localStorage.setItem('categories', JSON.stringify(categories))
        }

        appendSelectOptions = function(element) {
            let uncategorized = document.createElement("option")
            uncategorized.value = ''
            uncategorized.text = 'Uncategorized'
            element.appendChild(uncategorized)

            Object.keys(categories).forEach(category => {
                let opt = document.createElement("option")
                opt.value = category
                opt.text = category
                element.appendChild(opt)
            });
        }

        getDomainCategory = function(domain) {
            return Object.keys(categories).find(category => categories[category].includes(domain)) ?? ''
        }

        appendStory = function(story) {
            let d = document.createElement('details')
            document.getElementById("content").appendChild(d)

            let p1 = document.createElement('summary')
            d.appendChild(p1);

            let a = document.createElement('a')
            a.innerHTML = story['title']
            a.href = story['link']
            p1.appendChild(a)

            let s1 = document.createElement('span')
            s1.innerHTML = ' '
            p1.appendChild(s1);

            let comments = document.createElement('a')
            comments.innerHTML = '(comments)'
            comments.href = story['comments']
            p1.appendChild(comments)

            let p2 = document.createElement('p')
            d.appendChild(p2)

            let s2 = document.createElement('span')
            s2.innerHTML = story['domain'] + '&nbsp;'
            p2.appendChild(s2)

            let sel = document.createElement('select')
            sel.id = story['id']
            p2.appendChild(sel)
            appendSelectOptions(sel)
            sel.addEventListener(
                'change',
                function() { handleCategorizeStory(sel); },
                false
            );
            sel.value = getDomainCategory(story['domain'])
        }

        displayStories = function() {
            document.getElementById("content").innerHTML = ''
            currentCategory = document.getElementById("category").value
            stories.filter(story => {
                return currentCategory === getDomainCategory(story['domain'])
            }).forEach(story => appendStory(story));
        }

        loadValues()
        appendSelectOptions(document.getElementById("category"))
    </script>
  </body>
</html>
