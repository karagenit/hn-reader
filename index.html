<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Caleb's HN Reader</title>
  </head>
  <body>
    <select id="category" onchange="displayStories()">
        <option value="" selected>Uncategorized</option>
        <option value="test">Test</option>
      </select>
    <div id="content"></div>

    <script>
        let stories = [];
        let categories = { // TODO fill select with these options
            "test": ['github.com']
        }

        loadValues = async function() {
            res = await fetch('http://localhost:8080/')
            stories = await res.json()
            displayStories()
        }

        appendStory = function(story) {
            let p = document.createElement('p')
            p.innerHTML = story['title']
            document.getElementById("content").appendChild(p)
        }

        displayStories = function() {
            document.getElementById("content").innerHTML = ''
            currentCategory = document.getElementById("category").value
            // if currentCategory is blank, show stories where domain is not in any other category... otherwise filter them by that category
            if (currentCategory === '') {
                stories.forEach(story => {
                    appendStory(story)
                });
            } else {
                stories.filter(story => {
                    return categories[currentCategory]?.includes(story["domain"])
                }).forEach(story => {
                    appendStory(story)
                });
            }
        }

        loadValues()
    </script>
  </body>
</html>
