<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Caleb's HN Reader</title>
    <!-- This prevents the browser from requesting favicon.ico -->
    <link rel="icon" href="data:,">
    <script>
        window.onerror = function(msg, url, line, col, error) {
            alert('Error: ' + msg + '\nAt: ' + url + ':' + line + ':' + col);
            return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
            alert('Promise rejection: ' + event.reason);
        });

        // Check if modules are supported
        if (!('noModule' in HTMLScriptElement.prototype)) {
            alert('ES modules not supported on this browser');
        }

        // Log that this script ran
        alert('Debug script loaded');

        // Check if template rendering worked
        setTimeout(function() {
            var script = document.querySelector('script[src*="index.js"]');
            if (script) {
                alert('JS URL: ' + script.src);
            }
        }, 100);
    </script>
    <link rel="stylesheet" href="/assets/css/index.css?v={{.Version}}">
    <script type="module" src="/assets/js/index.js?v={{.Version}}"></script>
    <!-- this was tricky, you can't have multiple of these imports, LLM said to do settings,help but it has to be alphabetical! -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,-25&icon_names=help,settings" />
  </head>
  <body>
    <div class="toolbar">
        <toolbar-category-selector id="category"></toolbar-category-selector>
        <a href="https://caleb.software/posts/hn-reader.html">
            <span class="material-symbols-outlined">help</span>
        </a>
        <a href="/settings">
            <span class="material-symbols-outlined">settings</span>
        </a>
    </div>
    
    <x-story-list></x-story-list>
  </body>
</html>
