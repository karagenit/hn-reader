<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Caleb's HN Reader</title>
    <style>
        #content input {
            margin-bottom: 1rem;
            width: 24em;
            max-width: 100%;
        }

        details {
            margin-top: 1rem;
        }

        details pre {
            overflow: auto;
            background-color: #ddd;
        }

        textarea {
            margin-top: 1rem;
            width: 24em;
            max-width: 100%;
        }

        #importexport button {
            margin-top: 1rem;
        }
    </style>
  </head>
  <body>
    <div>
        <a href="/">Home</a>
        <p>You can rename existing categories to keep the domains in that category. You can also leave the category name blank to delete the category. Naming two categories the same thing will combine them into one.</p>
    </div>
    
    <div id="content">
        <p>Loading...</p>
    </div>

    <div>
        <button onclick="saveCategories()">Save</button>
    </div>

    <div id="importexport">
        <details>
            <summary>Click to view full JSON for export</summary>
            <pre><code id="export">{"export loading...": []}</code>
            </pre>
        </details>

        <textarea id="import" placeholder="Add JSON here to import"></textarea>
        <br>

        <button onclick="importJson()">Import</button>
    </div>

    <script>
        let categories = {};
        storedCategories = localStorage.getItem("categories");

        if (storedCategories) {
            categories = JSON.parse(storedCategories)
        }

        importJson = function() {
            imported = JSON.parse(document.getElementById('import').value)
            // Prevent accidentally blowing up your json with a misclick
            if (imported && Object.keys(imported).length > 0) {
                categories = imported
                localStorage.setItem('categories', JSON.stringify(categories))
                displayCategories()
            }
        }

        saveCategories = function() {
            newCategories = {}
            Array.from(document.getElementsByTagName('input')).forEach(input => {
                newName = input.value
                oldName = input.id
                // if there's no input value, we skip it because this means the user wants to delete it
                if (newName) {
                    // if it doesn't already exist, we create it
                    if (!newCategories[newName]) {
                        newCategories[newName] = []
                    }
                    // if it was an existing category, copy over the old domains
                    if (oldName) {
                        newCategories[newName].push(...categories[oldName])
                    }
                }
            })

            categories = newCategories
            localStorage.setItem('categories', JSON.stringify(categories))
            console.log(categories)
            displayCategories()
        }

        addNewCategoryInput = function (target) {
            this.removeEventListener('change', addNewCategoryInput)

            let input = document.createElement('input')
            input.type = 'text'
            input.placeholder = 'Add a new category here...'
            input.addEventListener(
                'change',
                addNewCategoryInput,
                false
            )
            document.getElementById("content").appendChild(input)
        }

        displayCategories = function() {
            document.getElementById("content").innerHTML = ''
            Object.keys(categories).forEach(category => {
                let input = document.createElement('input')
                input.type = 'text'
                input.placeholder = 'Previously "' + category + '" will be deleted'
                input.id = category
                input.value = category
                document.getElementById("content").appendChild(input)

                let br = document.createElement('br')
                document.getElementById("content").appendChild(br)
            })
            addNewCategoryInput()
        }

        displayCategories()

        document.getElementById('export').innerHTML = JSON.stringify(categories)
        console.log(JSON.stringify(categories))
    </script>
  </body>
</html>
